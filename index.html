<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiosco POS</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🏪 Kiosco POS</div>
    <nav class="nav" id="nav"></nav>
    <div class="top-actions">
      <span id="user-badge" class="badge" style="display:none"></span>
      <span id="shift-badge" class="badge"></span>
      <button class="btn ghost" id="theme-btn" title="Cambiar tema">🌓</button>
      <button class="btn ghost sm" id="logout-btn" title="Cerrar sesión" style="display:none">🔒 Salir</button>
    </div>
  </header>

  <div id="login-screen" class="login-screen active">
    <div class="login-card">
      <div class="login-brand">🏪 Kiosco POS</div>
      <h2>Iniciar Sesión</h2>
      <p class="muted">Ingresá tu nombre y clave de administrador para acceder al kiosco.</p>
      <form id="login-form">
        <div class="field" style="text-align:left">
          <label>Nombre de usuario / Administrador</label>
          <input id="login-user" type="text" required placeholder="Ej: admin o Marcos" autofocus autocomplete="username">
        </div>
        <div class="field" style="text-align:left">
          <label>Clave de Administrador</label>
          <input id="login-pass" type="password" required placeholder="Clave (por defecto: 1234)" autocomplete="current-password">
        </div>
        <button class="btn primary big" type="submit" style="width:100%;margin-top:.8rem">Ingresar al Kiosco</button>
      </form>
      <div id="login-error" class="danger" style="margin-top:.8rem;font-weight:bold;min-height:22px"></div>
      <p class="muted" style="font-size:.8rem;margin-top:1rem">Clave inicial: <code>1234</code></p>
    </div>
  </div>

  <main id="main" style="display:none">
    <section class="view" id="view-dash"></section>
    <section class="view" id="view-pos"></section>
    <section class="view" id="view-inv"></section>
    <section class="view" id="view-cash"></section>
    <section class="view" id="view-cli"></section>
    <section class="view" id="view-sup"></section>
    <section class="view" id="view-transf"></section>
  </main>

  <nav class="bottom-nav" id="bottom-nav"></nav>
  <div id="modals"></div>
  <div id="toasts"></div>

  <script src="js/ui.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/domain.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/pos.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/cash.js"></script>
  <script src="js/customers.js"></script>
  <script src="js/suppliers.js"></script>
  <script src="js/transfers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
